name: Windows validation

on:
  push:
    branches: [codex/windows-account-proxy]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and Windows Rust tests
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./proxy-gate -> target
      - run: npm ci
      - run: npm run build
      - name: Check changed Rust formatting (advisory)
        continue-on-error: true
        shell: pwsh
        run: |
          $base = git merge-base origin/main HEAD
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($base)) {
            throw "Could not find the main branch merge base."
          }
          $files = @(git diff --name-only --diff-filter=ACMR $base HEAD -- src-tauri | Where-Object { $_ -match '\.rs$' })
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list changed Rust files."
          }
          if ($files.Count -eq 0) {
            Write-Host "No changed Rust files to format-check."
          } else {
            rustfmt --check --edition 2021 --config-path rustfmt.toml --config skip_children=true $files
          }
      - name: Run Windows Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --target x86_64-pc-windows-msvc
      - name: Test Proxy Gate
        working-directory: proxy-gate
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc
      - name: Build Proxy Gate
        working-directory: proxy-gate
        run: cargo build --release --locked --package maam-proxy-gate --target x86_64-pc-windows-msvc
      - name: Build Windows installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --ci
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-nsis-acceptance
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/multi-agent-account-manager.exe
            proxy-gate/target/x86_64-pc-windows-msvc/release/proxy-gate.exe
          if-no-files-found: error
