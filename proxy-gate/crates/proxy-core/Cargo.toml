[package]
name = "maam-proxy-core"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Mihomo proxy pool parsing, static chain resolution, and route health checks"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
